[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Required by the official imported-launch workflow. Any change invalidates code pins.
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 128, fail_on_revert = true }

[profile.extended]
fuzz = { runs = 4096 }
invariant = { runs = 512, depth = 256, fail_on_revert = true }
